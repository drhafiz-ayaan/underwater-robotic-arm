# ros_gz_bridge topic map.
#
# The RGB image is NOT bridged here - ros_gz_image is used for it instead, since
# it republishes as image_transport and avoids a full uncompressed copy through
# the generic bridge at 20 Hz.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/camera_info"
  gz_topic_name: "/wrist_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/wrist_camera/points"
  gz_topic_name: "/wrist_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Grasp latch/release. perception publishes std_msgs/Empty on these.
- ros_topic_name: "/gripper/attach"
  gz_topic_name: "/gripper/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/gripper/detach"
  gz_topic_name: "/gripper/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

# NOTE: object poses are NOT bridged here. ros_gz_bridge's Pose_V -> TFMessage
# conversion leaves frame_id and child_frame_id empty on Jazzy (for both
# pose/info and dynamic_pose/info), and the PoseArray conversion drops names
# outright, so neither can identify a specific object. object_tf_publisher.py
# reads the named poses from gz directly and broadcasts real TF frames.
