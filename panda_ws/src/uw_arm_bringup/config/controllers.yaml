# ros2_control configuration for the underwater manipulator.
#
# update_rate is deliberately high (200 Hz). Underwater the added-mass term makes
# the effective inertia of each link roughly double, and a slow control loop
# interacts badly with the drag terms in the Hydrodynamics system.

controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # A JointTrajectoryController, not GripperActionController: the gripper has
    # two independently actuated fingers (no mimic - see gripper.xacro), and
    # GripperActionController drives exactly one joint.
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    # finger_right_joint is a mimic joint; ros2_control publishes it
    # automatically, so it is not listed here.


arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

    # Tolerances are looser than a dry industrial arm would use. Drag and added
    # mass introduce lag that a tight goal_time constraint would flag as a
    # failure even when the trajectory is tracked acceptably.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint1: {trajectory: 0.30, goal: 0.05}
      joint2: {trajectory: 0.30, goal: 0.05}
      joint3: {trajectory: 0.30, goal: 0.05}
      joint4: {trajectory: 0.30, goal: 0.05}
      joint5: {trajectory: 0.30, goal: 0.05}
      joint6: {trajectory: 0.30, goal: 0.05}


gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - finger_left_joint
      - finger_right_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

    # Generous goal tolerance. A successful grasp STALLS the fingers on the
    # object short of the commanded position - that is the desired outcome, not
    # a failure, so the tolerance must exceed the squeeze depth.
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      finger_left_joint: {trajectory: 0.05, goal: 0.02}
      finger_right_joint: {trajectory: 0.05, goal: 0.02}
